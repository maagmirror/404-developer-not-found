server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Health check para Docker / Easypanel.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # Bundles con hash en el nombre: cache larga e inmutable.
    location ~ ^/(evil-ai|terminal|terminated)/assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Sin barra final, redirigir a la subruta (si no, los assets relativos fallan).
    location = /evil-ai    { return 301 /evil-ai/; }
    location = /terminal   { return 301 /terminal/; }
    location = /terminated { return 301 /terminated/; }

    # Cada pantalla es una SPA: lo que no exista cae en su propio index.html.
    location /evil-ai/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /evil-ai/index.html;
    }
    location /terminal/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /terminal/index.html;
    }
    location /terminated/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /terminated/index.html;
    }

    # Portada.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
