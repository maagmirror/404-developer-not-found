server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compresión para texto; los videos/audio ya vienen comprimidos.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Health check para Docker / Easypanel.
    location = /healthz {
        access_log off;
        return 200 "ok";
        add_header Content-Type text/plain;
    }

    # Bundles con hash en el nombre: cache larga e inmutable.
    location ^~ /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Media (mp4/webm/ogg): soporta range requests para seek de video.
    location ~* \.(mp4|m4v|webm|ogv|ogg|mp3|wav)$ {
        add_header Cache-Control "public, max-age=86400";
        add_header Accept-Ranges bytes;
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta cae en index.html, que no se cachea.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
